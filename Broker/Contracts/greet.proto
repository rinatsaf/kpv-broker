syntax = "proto3";

package broker;

option csharp_namespace = "Broker.Contracts";

// ==================== СООБЩЕНИЯ ====================

message Message {
    string id = 1;                    // Уникальный ID сообщения
    string queue = 2;                 // Очередь
    bytes payload = 3;                // Тело сообщения
    map<string, string> headers = 4;  // Метаданные
    int64 timestamp = 5;              // Время создания (unix epoch)
    int32 ttl_seconds = 6;            // Время жизни в секундах
    int32 delivery_count = 7;         // Количество попыток доставки
}

// ==================== PUBLISHER ====================

message PublishRequest {
    Message message = 1;
}

message PublishResponse {
    string message_id = 1;      // ID принятого сообщения
    bool accepted = 2;          // Сообщение принято
    string queue_name = 3;      // Имя очереди
}

message PublishBatchRequest {
    repeated Message messages = 1;
}

message PublishBatchResponse {
    repeated string message_ids = 1;
    int32 accepted_count = 2;
    int32 rejected_count = 3;
    repeated string errors = 4;
}

// ==================== CONSUMER ====================

message SubscribeRequest {
    string queue = 1;                 // Очередь для подписки
    string consumer_group = 2;        // Группа потребителей
    string consumer_id = 3;           // ID потребителя
    int32 prefetch_count = 4;         // Количество сообщений для предвыборки
}

message ConsumeRequest {
    string queue = 1;
    string consumer_group = 2;
    int32 max_messages = 3;           // Максимум сообщений за раз
    int64 timeout_ms = 4;             // Таймаут ожидания
    string consumer_id = 5;          
}

message ConsumeResponse {
    repeated Message messages = 1;
    string consumer_id = 2;
}

message AcknowledgeRequest {
    string message_id = 1;
    string consumer_id = 2;
    bool success = 3;                 // true = ACK, false = NACK
    string reason = 4;                // Причина NACK
}

message AcknowledgeResponse {
    bool acknowledged = 1;
    string message_id = 2;
}

message RejectRequest {
    string message_id = 1;
    string consumer_id = 2;
    bool requeue = 3;                 // Вернуть в очередь
    string reason = 4;
}

message RejectResponse {
    bool rejected = 1;
    string message_id = 2;
    bool moved_to_dlq = 3;            // Перемещено в DLQ
}

// ==================== QUEUE MANAGEMENT ====================

message CreateQueueRequest {
    string name = 1;
    int32 max_size = 2;               // Максимальный размер очереди
    int32 message_ttl_seconds = 3;    // TTL сообщений
    int32 max_delivery_attempts = 4;  // Максимум попыток доставки
    bool dead_letter_enabled = 5;     // Включить DLQ
    string dead_letter_queue = 6;     // Имя DLQ
}

message CreateQueueResponse {
    bool success = 1;
    string queue_name = 2;
    string error = 3;
}

message DeleteQueueRequest {
    string name = 1;
}

message DeleteQueueResponse {
    bool success = 1;
}

message GetQueueInfoRequest {
    string name = 1;
}

message GetQueueInfoResponse {
    string name = 1;
    int64 message_count = 2;
    int64 consumer_count = 3;
    int64 dead_letter_count = 4;
    QueueStats stats = 5;
}

message QueueStats {
    int64 published_total = 1;
    int64 consumed_total = 2;
    int64 acknowledged_total = 3;
    int64 rejected_total = 4;
    int64 expired_total = 5;
    double avg_processing_time_ms = 6;
}

// ==================== ADMIN & METRICS ====================

message GetMetricsRequest {
    string queue_name = 1;
    int64 from_timestamp = 2;
    int64 to_timestamp = 3;
}

message GetMetricsResponse {
    map<string, double> metrics = 1;
}

message ListQueuesRequest {
    int32 page_size = 1;
    string page_token = 2;
}

message ListQueuesResponse {
    repeated QueueInfo queues = 1;
    string next_page_token = 2;
}

message QueueInfo {
    string name = 1;
    int64 message_count = 2;
    bool is_dead_letter_queue = 3;
}

message PurgeQueueRequest {
    string name = 1;
}

message PurgeQueueResponse {
    int64 messages_removed = 1;
}

// ==================== CONFIGURATION ====================

message BrokerConfig {
    int32 max_message_size_bytes = 1;
    int32 default_message_ttl_seconds = 2;
    int32 default_max_delivery_attempts = 3;
    bool dead_letter_enabled = 4;
    int32 consumer_timeout_seconds = 5;
}

message UpdateConfigRequest {
    BrokerConfig config = 1;
}

message UpdateConfigResponse {
    bool success = 1;
}

message GetConfigRequest {}

message GetConfigResponse {
    BrokerConfig config = 1;
}

// ==================== HEALTH & STATUS ====================

message GetBrokerStatusRequest {}

message BrokerStatus {
    bool is_healthy = 1;
    int64 uptime_seconds = 2;
    string version = 3;
    int32 active_connections = 4;
    int32 total_queues = 5;
    int64 total_messages = 6;
}

// ==================== СОБЫТИЯ (Server Streaming) ====================

message MessageEvent {
    Message message = 1;
    string queue_name = 2;
    int64 received_at = 3;
}

// ==================== СЕРВИСЫ ====================

  service PublisherService {
    rpc Publish(PublishRequest) returns (PublishResponse);
    rpc PublishBatch(PublishBatchRequest) returns (PublishBatchResponse);
  }
  
  service ConsumerService {
    rpc Subscribe(SubscribeRequest) returns (stream MessageEvent);
    rpc Consume(ConsumeRequest) returns (ConsumeResponse);
    rpc Acknowledge(AcknowledgeRequest) returns (AcknowledgeResponse);
    rpc Reject(RejectRequest) returns (RejectResponse);
  }
  
  service QueueService {
    rpc CreateQueue(CreateQueueRequest) returns (CreateQueueResponse);
    rpc DeleteQueue(DeleteQueueRequest) returns (DeleteQueueResponse);
    rpc GetQueueInfo(GetQueueInfoRequest) returns (GetQueueInfoResponse);
    rpc ListQueues(ListQueuesRequest) returns (ListQueuesResponse);
    rpc PurgeQueue(PurgeQueueRequest) returns (PurgeQueueResponse);
  }
  
  service MonitoringService {
    rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
    rpc GetBrokerStatus(GetBrokerStatusRequest) returns (BrokerStatus);
  }
  
  service ConfigService {
    rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
    rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  }
